services:
  - type: web
    name: ine-tracker-backend
    runtime: node
    rootDir: backend
    buildCommand: PLAYWRIGHT_BROWSERS_PATH=0 npm install && PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install chromium
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: MOCK_STORE_URL
        value: https://demo.inelabteamdev.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true
